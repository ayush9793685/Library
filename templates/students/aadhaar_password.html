{% extends 'base.html' %}
{% block content %}
<section class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="mb-1 text-xl font-extrabold">Aadhaar copy</h1>
  <p class="mb-4 text-sm text-slate-600">{{ student.first_name }} {{ student.last_name }} ({{ student.student_id }}). Enter the admin password to open the copy. Every view is logged.</p>
  <form method="post" class="space-y-3" autocomplete="off">
    {% csrf_token %}
    <input type="password" name="password" required autofocus placeholder="Password" autocomplete="off">
    {% if error %}<p class="text-sm text-red-600">{{ error }}</p>{% endif %}
    <div class="flex gap-2"><button class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Open copy</button>
      <a class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700" href="{% url 'students:detail' student.pk %}">Cancel</a></div>
  </form>
</section>
{% endblock %}
