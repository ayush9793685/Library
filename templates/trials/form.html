{% extends 'base.html' %}
{% block content %}
<section class="mx-auto max-w-2xl">
  <div class="mb-6">
    <h1 class="text-3xl font-bold tracking-tight text-slate-900">{{ title }}</h1>
    <p class="mt-1 text-sm text-slate-600">A trial visit needs no registration, seat or payment.</p>
  </div>
  <form method="post" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="mb-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700">{{ form.non_field_errors }}</div>{% endif %}
    <div class="grid grid-cols-1 gap-4">
      {% include '_form_fields.html' %}
    </div>
    <div class="mt-8 flex items-center justify-end gap-3">
      <a href="{% url 'trials:list' %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
      <button class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-slate-700">Save</button>
    </div>
  </form>
</section>
{% endblock %}
